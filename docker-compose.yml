services:
  db:
    image: postgres:16
    container_name: js-fastify-blog-db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10


  app:
    build: .
    container_name: js-fastify-blog-app
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      DATABASE_NAME: postgres
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_PORT: 5432
      DATABASE_HOST: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
